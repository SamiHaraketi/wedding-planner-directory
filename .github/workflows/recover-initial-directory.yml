name: Publish completed directory imports
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-initial-directory.yml']
  workflow_dispatch:

concurrency:
  group: initial-directory-publication
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42982437334
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Merge and validate public import data
        run: |
          shopt -s nullglob
          parts=(parts/*.sqlite)
          test "${#parts[@]}" -eq 29
          python merge_export.py initial.sqlite "${parts[@]}"
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("initial.sqlite") as db:
              assert db.execute("PRAGMA integrity_check").fetchone() == ("ok",)
              assert db.execute("SELECT COUNT(*) FROM listings").fetchone()[0] > 0
          PY
      - name: Publish directory snapshot
        run: |
          if ! gh release view database --json assets --jq '.assets[].name' | grep -Fxq live.sqlite; then
            cp initial.sqlite live.sqlite
            gh release create database live.sqlite --title "Live database" --notes "Initial snapshot from 29 regional artifacts. France and Canada are pending."
          else
            gh release download database -p live.sqlite
          fi
          python refresh_engine.py report live.sqlite | tee -a "$GITHUB_STEP_SUMMARY"
          gh release view database --json url,assets
