services:
  - type: web
    name: wedding-planner-directory-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    dockerCommand: sh -c 'python bootstrap_release.py && exec uvicorn api:app --host 0.0.0.0 --port "$PORT"'
    envVars:
      - key: WEDDING_DB
        value: /tmp/wedding.sqlite
      - key: WEDDING_WEB_ORIGINS
        value: https://vow-atlas-venue-finder.webflow.io
      - key: OLLAMA_DISABLE
        value: "1"
      - key: SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
